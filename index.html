<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cloth Store</title>
    <!-- CSS LINK -->
    <link rel="stylesheet" href="style.css">
    <!-- FONT LINK -->
    <link href="https://fonts.cdnfonts.com/css/beatrice-display-trial" rel="stylesheet">
    <!-- FONT AWESOME -->
     <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg==" crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>

<body>
    <!-- NAVIGATION BAR -->
    <section class="header container">
        <div class="navbar">
            <div class="navleft">
                <div class="menu"><img src="img/Group 36.png" alt="" class="menu-image"></div>
                <nav>
                    <ul>
                        <li><a href="">Home</a></li>
                        <li><a href="">Collections</a></li>
                        <li><a href="">Name</a></li>
                    </ul>
                </nav>
            </div>
            <div class="navmid">
                <a href=""><img class="logo" src="img/Group 53.png" alt=""></a>
            </div>
            <div class="navright">
                <div class="heart-image right">
                    <img class="heart" src="img/Group 8.png" alt="">
                </div>
                <div class="cart-image right">
                    <p class="cart-text">cart</p>
                    <img class="cart" src="img/Group 7.png" alt="">
                </div>
                <div class="profile right">
                    <img src="img/Group 6.png" alt="" class="profile-image">
                </div>
            </div> 
        </div>
    </section>
    <!-- MAIN SECTION -->
    <section class="main container">
        <div class="main-category">
            <p class="men category">MEN</p>
            <p class="women category">WOMEN</p>
            <p class="kids category">KIDS</p>
            <div class="search-bar">
                <img class="search-icon" src="img/Group 4.png" alt="">
                <input class="search-box" type="search" name="" id="" placeholder="Search">

            </div>
        </div>
        <div class="main-collection">
            <div class="new-collection">
                <h2 class="new-collection-header">
                    NEW
                    <br>
                    COLLECTION
                </h2>
                <P class="new-collection-text">
                    Summer
                    <br>
                    2024
                </P>
                <div class="collections-btn">
                    <button class="go-to-shop">
                        Go To shop
                        <img class="btn-arrow" src="img/Vector.png" alt="">
                    </button>
                    <button class="btn-left"> <i class="fa-solid fa-less-than fa-lg"></i> </button>
                    <button class="btn-right"><i class="fa-solid fa-greater-than fa-lg"></i></button>
                </div>

            </div>
            <div class="new-collection-image">
                <a href=""><img class="new-image" src="img/Rectangle 12.png" alt=""></a>
                <a href=""><img class="new-image" src="img/Rectangle 13.png" alt=""></a>
            </div>
        </div>
    </section>
</body>

</html>
